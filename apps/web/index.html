<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content, viewport-fit=cover"
    />
    <!-- system bars of the installed PWA = app background (PLNRAPP-256); a manual theme — ui/useTheme.ts.
         viewport-fit=cover: the page draws under the bottom system bar (Android Chrome ignores theme-color
         there and takes the static manifest theme_color), the safe-area padding — styles.css #app -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111113" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>Planar</title>
    <script>
      try {
        var t = localStorage.getItem('planar.theme');
        if (t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches))
          document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
    <style>
      /* boot screen until Vue mounts (replaced on mount); colors = the app background and the brand accent */
      html,
      body {
        margin: 0;
        background: #fff;
      }
      html.dark,
      .dark body {
        background: #111113;
      }
      .boot {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        height: 100vh;
        height: 100dvh;
        /* shown only if loading is noticeable: a fast start doesn't flash the logo */
        opacity: 0;
        animation: boot-in 0.3s ease-out 0.15s forwards;
      }
      .boot svg {
        width: 56px;
        height: 56px;
        border-radius: 14px;
        box-shadow: 0 8px 24px rgb(79 70 229 / 0.28);
        animation: boot-breathe 1.6s ease-in-out infinite;
      }
      .boot i {
        position: relative;
        width: 96px;
        height: 3px;
        overflow: hidden;
        border-radius: 3px;
        background: rgb(79 70 229 / 0.14);
      }
      .boot i::after {
        content: '';
        position: absolute;
        inset: 0;
        width: 40%;
        border-radius: 3px;
        background: #4f46e5;
        animation: boot-run 1.1s ease-in-out infinite;
      }
      .dark .boot i {
        background: rgb(129 140 248 / 0.18);
      }
      .dark .boot i::after {
        background: #818cf8;
      }
      @keyframes boot-in {
        to {
          opacity: 1;
        }
      }
      @keyframes boot-breathe {
        50% {
          transform: scale(0.94);
        }
      }
      @keyframes boot-run {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(250%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot svg,
        .boot i::after {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="boot" role="status" aria-label="Planar">
        <svg viewBox="0 0 192 192" aria-hidden="true">
          <rect width="192" height="192" fill="#4f46e5" />
          <path fill="#fff" fill-rule="evenodd" d="M38 40H130V112H58V154H38ZM58 60H110V92H58Z" />
        </svg>
        <i></i>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
