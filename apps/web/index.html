<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content, viewport-fit=cover"
    />
    <!-- system bars of the installed PWA = app background (PLNRAPP-256); a manual theme — ui/useTheme.ts.
         viewport-fit=cover: the page draws under the bottom system bar (Android Chrome ignores theme-color
         there and takes the static manifest theme_color), the safe-area padding — styles.css #app -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111113" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>Planar</title>
    <script>
      try {
        var t = localStorage.getItem('planar.theme');
        if (t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches))
          document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
    <style>
      /* boot skeleton of the shell, replaced by Vue on mount */
      .boot {
        display: flex;
        height: 100vh;
        background: #fff;
      }
      .boot nav {
        width: 240px;
        background: #f7f7f8;
        border-right: 1px solid #e6e6e9;
      }
      .boot main {
        flex: 1;
      }
      .boot main i {
        display: block;
        height: 48px;
        border-bottom: 1px solid #e6e6e9;
        background: #fff;
      }
      .dark .boot {
        background: #111113;
      }
      .dark .boot nav,
      .dark .boot main i {
        border-color: #26262a;
        background: #17171a;
      }
      @media (max-width: 767px) {
        .boot nav {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="boot">
        <nav></nav>
        <main><i></i></main>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
