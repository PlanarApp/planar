name: ${COMPOSE_PROJECT_NAME:-planar-dev}

x-node: &node
  image: node:24
  working_dir: /app
  volumes:
    - .:/app
    # node_modules in volumes: they do not interfere with host ones and do not depend on its platform (new workspace package → add a volume)
    - nm_root:/app/node_modules
    - nm_api:/app/apps/api/node_modules
    - nm_web:/app/apps/web/node_modules
    - nm_shared:/app/packages/shared/node_modules
    - nm_e2e:/app/e2e/node_modules
    - pnpm_store:/pnpm-store
  environment: &node-env
    npm_config_store_dir: /pnpm-store
    CI: 'true'

services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: planar
    ports:
      - '${DEV_PG_PORT:-55433}:5432'
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d planar -h localhost']
      interval: 2s
      timeout: 3s
      retries: 150

  # one-off dependency install: api and web wait for it to finish (no race between two pnpm installs)
  deps:
    <<: *node
    command: sh -c "corepack enable && pnpm install --frozen-lockfile"
    restart: 'no'

  api:
    <<: *node
    command: sh -c "corepack enable && pnpm --filter @planar/api dev"
    environment:
      <<: *node-env
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/planar
      PORT: '3000'
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:${WEB_PORT:-5173}}
      EXTRA_ORIGINS: ${EXTRA_ORIGINS:-http://127.0.0.1:${WEB_PORT:-5173}}
      COOKIE_SECURE: 'false'
      DATA_DIR: /app/data
      # dev/e2e: the ai module can be enabled (LLM actions need no runner)
      PLANAR_AI: ${PLANAR_AI:-on}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      # dev/e2e: fixed default key (./dev.sh up writes its own into .env; reset does not create it)
      PLANAR_SECRET_KEY: ${PLANAR_SECRET_KEY:-ZGV2LW9ubHktc2VjcmV0LWtleS0zMi1ieXRlcy0hISE=}
      LOG_LEVEL: info
      # dev/e2e: доставка вебхуков на хост (приёмник e2e); в проде — пусто
      WEBHOOKS_ALLOW_HOSTS: ${WEBHOOKS_ALLOW_HOSTS:-host.docker.internal}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '${API_PORT:-3000}:3000'
    depends_on:
      postgres:
        condition: service_healthy
      deps:
        condition: service_completed_successfully

  web:
    <<: *node
    command: sh -c "corepack enable && pnpm --filter @planar/web dev"
    environment:
      <<: *node-env
      API_PROXY_TARGET: http://api:3000
    ports:
      - '${WEB_PORT:-5173}:5173'
    depends_on:
      deps:
        condition: service_completed_successfully

volumes:
  pgdata:
  nm_root:
  nm_api:
  nm_web:
  nm_shared:
  nm_e2e:
  pnpm_store:

# explicit subnet: on shared hosts docker default pools are often exhausted; parallel stacks get their own DEV_SUBNET
networks:
  default:
    ipam:
      config:
        - subnet: ${DEV_SUBNET:-10.231.0.0/24}
