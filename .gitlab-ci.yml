image: node:24

stages: [lint, test, build]

# a new commit on the branch (e.g. several MRs merged one after another into main) cancels the older
# pipeline: only the newest commit builds and pushes `edge`; release tags are a separate ref
workflow:
  auto_cancel:
    on_new_commit: interruptible

default:
  interruptible: true

.pnpm:
  cache:
    key:
      files: [pnpm-lock.yaml]
    paths: [.pnpm-store/]
  before_script:
    - corepack enable
    - pnpm config set store-dir "$CI_PROJECT_DIR/.pnpm-store"
    - pnpm install --frozen-lockfile

test:
  extends: .pnpm
  stage: test
  services:
    - name: pgvector/pgvector:pg18
      alias: postgres
  variables:
    POSTGRES_PASSWORD: postgres
    TESTDB_URL: postgres://postgres:postgres@postgres:5432/postgres
  script:
    - pnpm vitest run --project api apps/api/test/seed-demo.test.ts --reporter=verbose
    - pnpm vitest run --project api --reporter=dot
