image: node:24

stages: [lint, test, build]

# a new commit on the branch (e.g. several MRs merged one after another into main) cancels the older
# pipeline: only the newest commit builds and pushes `edge`; release tags are a separate ref
workflow:
  auto_cancel:
    on_new_commit: interruptible

default:
  interruptible: true

.pnpm:
  cache:
    key:
      files: [pnpm-lock.yaml]
    paths: [.pnpm-store/]
  before_script:
    - corepack enable
    - pnpm config set store-dir "$CI_PROJECT_DIR/.pnpm-store"
    - pnpm install --frozen-lockfile

lint:
  extends: .pnpm
  stage: lint
  script: [pnpm lint]

test:
  extends: .pnpm
  stage: test
  services:
    - name: pgvector/pgvector:pg18
      alias: postgres
  variables:
    POSTGRES_PASSWORD: postgres
    TESTDB_URL: postgres://postgres:postgres@postgres:5432/postgres
  script: [pnpm test]

.image:
  stage: build
  image: docker:27
  services: [docker:27-dind]
  variables:
    DOCKER_TLS_CERTDIR: /certs
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - |
      img="$CI_REGISTRY_IMAGE/$NAME"
      if [ -n "$CI_COMMIT_TAG" ]; then
        v="${CI_COMMIT_TAG#v}"
        tags="$v ${v%.*} latest"
      else
        tags="edge"
      fi
      args=""
      for t in $tags; do args="$args -t $img:$t"; done
      docker build $args -f "$DOCKERFILE" "${CONTEXT:-.}"
      for t in $tags; do docker push "$img:$t"; done

image-api:
  extends: .image
  variables: { NAME: api, DOCKERFILE: apps/api/Dockerfile }

image-caddy:
  extends: .image
  variables: { NAME: caddy, DOCKERFILE: deploy/caddy.Dockerfile }

image-ai-runner:
  extends: .image
  variables: { NAME: ai-runner, DOCKERFILE: apps/ai-runner/Dockerfile }

# ~3.2 GB: on main rebuild only when the image itself changes; release tags always.
# `changes` compares with the previous push only: if the pipeline that changed docker/ai-agent was
# cancelled (auto_cancel) the next ones do not build it. So on every other main pipeline the job is
# manual — run it to rebuild `edge`
image-ai-agent:
  extends: .image
  variables: { NAME: ai-agent, DOCKERFILE: docker/ai-agent/Dockerfile, CONTEXT: docker/ai-agent }
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: [docker/ai-agent/**/*]
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
