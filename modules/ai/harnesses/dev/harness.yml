statuses:
  - { key: backlog, name: Бэклог, category: backlog, color: gray }
  - { key: clarify, name: Уточнение, category: todo, color: amber }
  - { key: todo, name: К работе, category: todo, color: blue }
  - { key: in_progress, name: В работе, category: in_progress, color: violet }
  - { key: review, name: Ревью, category: in_progress, color: orange }
  - { key: test_prod, name: Test prod, category: in_progress, color: cyan }
  - { key: done, name: Готово, category: done, color: green }
labels:
  - { key: has_plan, name: Есть план, color: green }
  - { key: waiting, name: Ждёт ответа, color: amber }
fields:
  - { key: budget, name: Бюджет, type: number }
actions: [plan, decompose, triage, discussion, assign, mention, checklist, chat, dev, review, test]
rules:
  - key: dev_in_todo
    name: Разработка
    description: ИИ реализует задачу в репозитории проекта и открывает MR с автомержем после CI. Только задачи, где ИИ — исполнитель.
    trigger: { type: task.status_changed, to: [todo] }
    filter: { assignee: [ai] }
    actions: [{ type: ai_run, action: dev }]
  - key: review_mr
    name: Ревью MR
    description: ИИ разбирает MR задачи и оставляет комментарии к diff в GitLab. Только задачи, где ИИ — исполнитель.
    trigger: { type: task.status_changed, to: [review] }
    filter: { assignee: [ai] }
    actions: [{ type: ai_run, action: review }]
  - key: test_on_prod
    name: Тестирование на контуре
    description: ИИ дожидается выкладки и проверяет задачу в браузере (Playwright) на контуре. Только задачи, где ИИ — исполнитель.
    trigger: { type: task.status_changed, to: [test_prod] }
    filter: { assignee: [ai] }
    actions: [{ type: ai_run, action: test }]
  - key: plan_in_backlog
    name: План в бэклоге
    description: ИИ проверяет задачу, пишет план и оценивает бюджет. Только задачи, где ИИ — исполнитель.
    trigger: { type: task.status_changed, to: [backlog] }
    filter: { assignee: [ai] }
    actions: [{ type: ai_run, action: plan }]
  - key: triage_new
    name: Триаж новых задач
    description: ИИ разбирает новую задачу. Только задачи, где ИИ — исполнитель.
    trigger: { type: task.created }
    filter: { assignee: [ai] }
    actions: [{ type: ai_run, action: triage }]
  - key: waiting_on
    name: Вопрос ИИ — метка «Ждёт ответа»
    description: ИИ задал вопрос человеку и перевёл задачу в «Уточнение» — ставится метка «Ждёт ответа».
    trigger: { type: task.status_changed, to: [clarify] }
    filter: { assignee: [ai] }
    actions: [{ type: add_label, labelId: waiting }]
  - key: waiting_off
    name: Ответ получен — снять «Ждёт ответа»
    description: Задача вышла из «Уточнения» (на вопросы ответили, ИИ продолжает) — метка «Ждёт ответа» снимается.
    trigger: { type: task.status_changed, from: [clarify] }
    filter: { assignee: [ai] }
    actions: [{ type: remove_label, labelId: waiting }]
  - key: waiting_answered
    name: Ответ человека на вопрос
    description: Человек ответил в ветке вопроса, назначенного на него, — вопрос закрывается. Метку снимает выход из «Уточнения» или ИИ, продолжив работу.
    trigger: { type: comment.added, byHuman: true }
    filter: { assignee: [ai], label: [waiting] }
    actions: [{ type: resolve_comment }]
settings: { questionStatus: clarify }
# AI events without a rule → the action that answers them; an event left out — the built-in prompt
events: { comment: assign, mention: mention, checklist: checklist, chat: chat }
