statuses:
  - { key: applied, name: Отклик, category: backlog, color: gray }
  - { key: screening, name: Скрининг, category: todo, color: blue }
  - { key: clarify, name: Уточнение, category: todo, color: amber }
  - { key: interview, name: Интервью, category: in_progress, color: violet }
  - { key: test, name: Тестовое, category: in_progress, color: cyan }
  - { key: offer, name: Оффер, category: in_progress, color: orange }
  - { key: hired, name: Нанят, category: done, color: green }
  - { key: rejected, name: Отказ, category: cancelled, color: red }
labels:
  - { key: strong, name: сильный, color: green }
  - { key: no_reply, name: нет ответа, color: amber }
  - { key: waiting, name: Ждёт ответа, color: amber }
fields:
  - { key: email, name: Email, type: text }
  - { key: source, name: Источник, type: text }
  - { key: resume, name: Резюме, type: url }
  - { key: expected_salary, name: Ожидаемая зарплата, type: money }
actions:
  [
    screening,
    questionnaire,
    interview_questions,
    interview_summary,
    offer,
    rejection,
    ping,
    report,
    assign,
    mention,
    checklist,
    chat,
  ]
rules:
  - key: screen_applied
    name: Скрининг отклика
    description: ИИ сверяет резюме с требованиями вакансии (родительская задача). Только задачи, где ИИ — исполнитель.
    trigger: { type: task.status_changed, to: [applied] }
    filter: { assignee: [ai] }
    actions: [{ type: ai_run, action: screening }]
  - key: questionnaire_screening
    name: Вопросы по пробелам резюме
    description: ИИ готовит письмо кандидату с вопросами по пробелам.
    trigger: { type: task.status_changed, to: [screening] }
    filter: { assignee: [ai] }
    actions: [{ type: ai_run, action: questionnaire }]
  - key: questions_interview
    name: Вопросы к интервью
    trigger: { type: task.status_changed, to: [interview] }
    filter: { assignee: [ai] }
    actions: [{ type: ai_run, action: interview_questions }]
  - key: summary_interview
    name: Итоги интервью
    description: После комментария человека в статусе «Интервью» ИИ подводит итог по отзывам интервьюеров.
    trigger: { type: comment.added, byHuman: true }
    filter: { assignee: [ai], status: [interview] }
    actions: [{ type: ai_run, action: interview_summary }]
  - key: offer_stage
    name: Письмо с оффером
    trigger: { type: task.status_changed, to: [offer] }
    filter: { assignee: [ai] }
    actions: [{ type: ai_run, action: offer }]
  - key: rejection_stage
    name: Письмо с отказом
    trigger: { type: task.status_changed, to: [rejected] }
    filter: { assignee: [ai] }
    actions: [{ type: ai_run, action: rejection }]
  - key: stale_ping
    name: Напоминание рекрутеру
    description: Кандидат завис на 3 дня.
    trigger: { type: task.stale, days: 3 }
    filter: { assignee: [ai] }
    actions: [{ type: ai_run, action: ping }]
  - key: weekly_report
    name: Еженедельный отчёт по найму
    trigger: { type: schedule, cron: '0 17 * * 5' }
    filter: { assignee: [ai] }
    actions: [{ type: ai_run, action: report }]
  - key: waiting_on
    name: Вопрос ИИ — метка «Ждёт ответа»
    description: ИИ задал вопрос человеку и перевёл задачу в «Уточнение» — ставится метка «Ждёт ответа».
    trigger: { type: task.status_changed, to: [clarify] }
    filter: { assignee: [ai] }
    actions: [{ type: add_label, labelId: waiting }]
  - key: waiting_off
    name: Ответ получен — снять «Ждёт ответа»
    description: Задача вышла из «Уточнения» (на вопросы ответили, ИИ продолжает) — метка «Ждёт ответа» снимается.
    trigger: { type: task.status_changed, from: [clarify] }
    filter: { assignee: [ai] }
    actions: [{ type: remove_label, labelId: waiting }]
  - key: waiting_answered
    name: Ответ человека на вопрос
    description: Человек ответил в ветке вопроса, назначенного на него, — вопрос закрывается. Метку снимает выход из «Уточнения» или ИИ, продолжив работу.
    trigger: { type: comment.added, byHuman: true }
    filter: { assignee: [ai], label: [waiting] }
    actions: [{ type: resolve_comment }]
settings: { questionStatus: clarify }
# AI events without a rule → the action that answers them; an event left out — the built-in prompt
events: { comment: assign, mention: mention, checklist: checklist, chat: chat }
