statuses:
  - { key: new, name: Новое, category: backlog, color: gray }
  - { key: analysis, name: Разбор, category: in_progress, color: violet }
  - { key: clarify, name: Уточнение, category: todo, color: amber }
  - { key: in_progress, name: В работе, category: in_progress, color: blue }
  - { key: solved, name: Решено, category: done, color: green }
  - { key: closed, name: Закрыто, category: done, color: gray }
labels:
  - { key: urgent, name: срочно, color: red }
  - { key: escalated, name: эскалировано, color: amber }
  - { key: auto_closed, name: автозакрыто, color: gray }
  - { key: waiting, name: Ждёт ответа, color: amber }
fields:
  - { key: customer, name: Клиент, type: text }
  - { key: email, name: Email, type: text }
  - { key: category, name: Категория, type: text }
  - { key: urgency, name: Срочность, type: text }
actions: [triage, draft_reply, escalate_dev, close, to_wiki, assign, mention, checklist, chat]
rules:
  - key: triage_new
    name: Разбор нового обращения
    description: ИИ определяет категорию и срочность нового обращения. Только задачи, где ИИ — исполнитель.
    trigger: { type: task.status_changed, to: [new] }
    filter: { assignee: [ai] }
    actions: [{ type: ai_run, action: triage }]
  - key: wiki_solved
    name: В вики после решения
    description: ИИ решает, стоит ли сохранить решение в вики поддержки. Только задачи, где ИИ — исполнитель.
    trigger: { type: task.status_changed, to: [solved] }
    filter: { assignee: [ai] }
    actions: [{ type: ai_run, action: to_wiki }]
  - key: escalate_unassigned
    name: Эскалация без исполнителя
    description: Обращение 2 часа без исполнителя — подзадача для разработчиков. Только задачи, где ИИ — исполнитель.
    trigger: { type: task.unassigned, hours: 2 }
    filter: { assignee: [ai] }
    actions: [{ type: ai_run, action: escalate_dev }]
  - key: auto_close_waiting
    name: Автозакрытие без ответа
    description: Клиент не отвечает 3 дня — метка и закрытие с комментарием. Только задачи, где ИИ — исполнитель.
    trigger: { type: task.waiting_human, days: 3 }
    filter: { assignee: [ai] }
    actions:
      - { type: add_label, labelId: auto_closed }
      - { type: ai_run, action: close }
  - key: waiting_on
    name: Вопрос ИИ — метка «Ждёт ответа»
    description: ИИ задал вопрос человеку и перевёл задачу в «Уточнение» — ставится метка «Ждёт ответа».
    trigger: { type: task.status_changed, to: [clarify] }
    filter: { assignee: [ai] }
    actions: [{ type: add_label, labelId: waiting }]
  - key: waiting_off
    name: Ответ получен — снять «Ждёт ответа»
    description: Задача вышла из «Уточнения» (на вопросы ответили, ИИ продолжает) — метка «Ждёт ответа» снимается.
    trigger: { type: task.status_changed, from: [clarify] }
    filter: { assignee: [ai] }
    actions: [{ type: remove_label, labelId: waiting }]
  - key: waiting_answered
    name: Ответ человека на вопрос
    description: Человек ответил в ветке вопроса, назначенного на него, — вопрос закрывается. Метку снимает выход из «Уточнения» или ИИ, продолжив работу.
    trigger: { type: comment.added, byHuman: true }
    filter: { assignee: [ai], label: [waiting] }
    actions: [{ type: resolve_comment }]
settings: { questionStatus: clarify }
# AI events without a rule → the action that answers them; an event left out — the built-in prompt
events: { comment: assign, mention: mention, checklist: checklist, chat: chat }
