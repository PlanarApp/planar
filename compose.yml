name: planar

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '5'

services:
  postgres:
    logging: *logging
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    networks: [app]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
      POSTGRES_DB: planar
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d planar -h localhost']
      interval: 5s
      timeout: 3s
      retries: 60

  api:
    logging: *logging
    image: ${PLANAR_REGISTRY:-registry.gitlab.com/planarhq/planar}/api:${PLANAR_VERSION:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}@postgres:5432/planar
      PORT: '3000'
      PUBLIC_URL: ${PUBLIC_URL:-https://${PLANAR_DOMAIN:-localhost}}
      EXTRA_ORIGINS: ${EXTRA_ORIGINS:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      DATA_DIR: /data
      # empty → 50 (2 in demo mode)
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-}
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      DB_POOL_MAX: ${DB_POOL_MAX:-}
      DEMO_MODE: ${DEMO_MODE:-false}
      DEMO_RESET_HOURS: ${DEMO_RESET_HOURS:-24}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      PLANAR_SECRET_KEY: ${PLANAR_SECRET_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Caddy subnet: trust X-Forwarded-For only from there
      TRUST_PROXY: ${PLANAR_SUBNET:-172.30.0.0/24}
    networks: [app]
    volumes:
      - data:/data
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    logging: *logging
    image: ${PLANAR_REGISTRY:-registry.gitlab.com/planarhq/planar}/caddy:${PLANAR_VERSION:-latest}
    restart: unless-stopped
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks: [app]
    environment:
      # empty → :80 (Caddy does not take the default from the Caddyfile when the variable is empty)
      PLANAR_DOMAIN: ${PLANAR_DOMAIN:-:80}
    depends_on:
      - api

networks:
  app:
    ipam:
      config:
        - subnet: ${PLANAR_SUBNET:-172.30.0.0/24}

volumes:
  pgdata:
  data:
  caddy_data:
  caddy_config:
