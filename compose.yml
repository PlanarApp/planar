name: planar

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '5'

services:
  postgres:
    logging: *logging
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    networks: [app]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
      POSTGRES_DB: planar
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d planar -h localhost']
      interval: 5s
      timeout: 3s
      retries: 60

  api:
    logging: *logging
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}@postgres:5432/planar
      PORT: '3000'
      PUBLIC_URL: ${PUBLIC_URL:-https://${PLANAR_DOMAIN:-localhost}}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      DATA_DIR: /data
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      PLANAR_SECRET_KEY: ${PLANAR_SECRET_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # подсеть Caddy: только оттуда верим X-Forwarded-For
      TRUST_PROXY: ${PLANAR_SUBNET:-172.30.0.0/24}
    networks: [app]
    volumes:
      - data:/data
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    logging: *logging
    image: caddy:2
    restart: unless-stopped
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # статика web: pnpm --filter @planar/web build
      - ./apps/web/dist:/srv:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [app]
    environment:
      # пусто → :80 (Caddy при пустой переменной не берёт умолчание из Caddyfile)
      PLANAR_DOMAIN: ${PLANAR_DOMAIN:-:80}
    depends_on:
      - api

networks:
  app:
    ipam:
      config:
        - subnet: ${PLANAR_SUBNET:-172.30.0.0/24}

volumes:
  pgdata:
  data:
  caddy_data:
  caddy_config:
