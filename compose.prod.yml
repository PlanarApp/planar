# Prod from registry images with data in ./data instead of named volumes.
# Usage: ./start.sh (writes COMPOSE_FILE=compose.yml:compose.prod.yml into .env, so ops/ scripts use this stack too)
services:
  postgres:
    volumes: !override
      - ./data/postgres:/var/lib/postgresql
  api:
    volumes: !override
      - ./data/api:/data
  caddy:
    volumes: !override
      - ./data/caddy/data:/data
      - ./data/caddy/config:/config
